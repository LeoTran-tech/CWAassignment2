# assi2/.github/workflows/playwright.yml

name: Playwright Tests

# Trigger the workflow when
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60                       # to avoid hangin indefinitely
    runs-on: ubuntu-latest                    # the runner envionment    
    
    steps:
    - uses: actions/checkout@v4               # clonde code from the repo to the runner
    - uses: actions/setup-node@v4             # set up Node.js env using Node lts
      with:
        node-version: lts/*
    - name: Install dependencies              # install dependencies from package-lock.json
      run: npm ci
    - name: Install Playwright Browsers       # install Playwright browsers and dependencies
      run: npx playwright install --with-deps
    - name: Run Playwright tests              # run the tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4        # upload report for failed tests
      if: ${{ !cancelled() }}                 # only upload if the workflow is not cancelled
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30                    # keep the report for 30 days
